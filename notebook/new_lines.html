    nav a:hover { border-bottom: 2px dotted #000; }

      max-width: 560px;

      padding-bottom: 6rem;

    .poem-body p {
      margin: 0;
      display: block;
    }

    img {
      width: 30%;
      height: auto;
      padding-bottom: 1rem;
    }

    /* each line nudged to a different indent — nothing lines up */
    .poem-body p:nth-child(1)  { padding-left: 1.2rem; }
    .poem-body p:nth-child(2)  { padding-left: 3.8rem; }
    .poem-body p:nth-child(3)  { padding-left: 0.4rem; }
    .poem-body p:nth-child(4)  { padding-left: 5.1rem; }
    .poem-body p:nth-child(5)  { padding-left: 2.0rem; }
    .poem-body p:nth-child(6)  { padding-left: 4.4rem; }
    .poem-body p:nth-child(7)  { padding-left: 1.6rem; }
    .poem-body p:nth-child(8)  { padding-left: 3.2rem; }
    .poem-body p:nth-child(9)  { padding-left: 0.8rem; }

  <div class="project-header">
    <h1 class="project-title">New Lines</h1>
    <div class="project-meta">
      <span class="project-year">2025</span>
    </div>
  </div>
  <img src="../assets/notebook/lopsided_face.jpg"/>
  <div class="poem-body">
    <p>My lopsided face</p>
    <p>In a house full of cracks</p>
    <p>Broken heart</p>
    <p>In a house full of mistakes</p>
    <p>Torn out shoes</p>
    <p>On a worn out street</p>
    <p>Things I used to hate</p>
    <p>That I learned to love</p>
    <p>Because now I know</p>
    <p>I can only love imperfect things</p>
  </div>
