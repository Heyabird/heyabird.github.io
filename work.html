<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work — Portfolio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #000;
      background: #fff;
      padding: 2.5rem;
      max-width: 980px;
      margin: 0 auto;
    }

    nav {
      display: flex;
      gap: 2rem;
      margin-bottom: 3.5rem;
      font-size: 14px;
    }

    nav a {
      color: #000;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    nav a:hover { border-bottom-color: #000; }
    nav a.active { border-bottom-color: #000; }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 2.5rem;
    }

    .filter-btn {
      font-size: 12px;
      font-family: Arial, sans-serif;
      padding: 3px 12px;
      border: 0px solid #000;
      border-radius: 20px;
      background: #fff;
      color: #000;
      cursor: pointer;
      background-color: #b9f4ff;
    }

    .filter-btn:hover { background: #f0f0f0; }
    .filter-btn.active { background: #000; color: #fff; }

    .count {
      font-size: 12px;
      color: #bbb;
      margin-bottom: 1.25rem;
    }

    /* ── two col layout ── */
    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 0;
      border-top: 1px solid #000;
      min-height: 520px;
    }

    /* ── left list ── */
    .project-list { border-right: 1px solid #000; }

    .project-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.9rem 1.25rem 0.9rem 0;
      border-bottom: 1px solid #ebebeb;
      cursor: pointer;
      gap: 10px;
    }

    .project-item:hover { background: #fafafa; }
    .project-item.active-item { background: #f5f5f5; }
    .project-item.hidden { display: none; }

    .item-title {
      font-size: 14px;
      color: #000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-year { font-size: 12px; color: #bbb; flex-shrink: 0; }

    /* ── right detail ── */
    .project-detail {
      padding: 1.5rem 0 2rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .detail-empty { color: #ccc; font-size: 14px; }

    .detail-img {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      display: block;
      border: 1px solid #000;
    }

    .detail-img-placeholder {
      width: 100%;
      height: 200px;
      background: #f0f0f0;
      border: 1px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #bbb;
    }

    .detail-title {
      font-size: 24px;
      font-weight: normal;
      line-height: 1.2;
    }

    .detail-meta {
      font-size: 13px;
      color: #999;
    }

    .detail-keywords {
      font-size: 13px;
      color: #bbb;
    }

    .detail-desc {
      font-size: 15px;
      line-height: 1.8;
      color: #333;
    }

    .detail-link {
      font-size: 13px;
      color: #000;
      text-decoration: none;
      border-bottom: 1px solid #000;
      display: inline-block;
    }

    .detail-link:hover { opacity: 0.6; }

    @media (max-width: 640px) {
  body { padding: 1.25rem; }

  nav { gap: 1.25rem; margin-bottom: 2rem; }

  .filter-btn { font-size: 11px; padding: 3px 10px; }

  .layout {
    grid-template-columns: 1fr;
    border-top: 1px solid #000;
  }

  .project-list { border-right: none; }

  .project-detail {
    padding: 1.25rem 0 1.5rem;
    border-top: 1px solid #000;
  }

  .detail-img { max-height: 200px; }

  .detail-title { font-size: 20px; }
}
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="work.html" class="active">Work</a>
    <a href="library.html">Library</a>
    <a href="about.html">About</a>
  </nav>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="participatory">Participatory</button>
    <button class="filter-btn" data-filter="sound">Sound</button>
    <button class="filter-btn" data-filter="installation">Installation</button>
    <button class="filter-btn" data-filter="typography">Typography</button>
    <button class="filter-btn" data-filter="p5">p5.js</button>
    <button class="filter-btn" data-filter="data-viz">Data Viz</button>
    <button class="filter-btn" data-filter="critical-ai">Critical AI/Data</button>
    <button class="filter-btn" data-filter="mapping">Mapping</button>
    <button class="filter-btn" data-filter="archive">Archive</button>
    <button class="filter-btn" data-filter="workshop">Workshop</button>
    <button class="filter-btn" data-filter="physical">Physical</button>
    <button class="filter-btn" data-filter="digital">Digital</button>
    <button class="filter-btn" data-filter="both">Physical & Digital</button>
  </div>

  <!-- <p class="count" id="count">15 projects</p> -->

  <div class="layout">
    <div class="project-list" id="project-list"></div>
    <div class="project-detail" id="project-detail">
      <p class="detail-empty">← select a project</p>
    </div>
  </div>

  <script>
    const projects = [
      {
        id: 'noraebang',
        title: 'Noraebang',
        year: '2026',
        tags: 'sound participatory installation bio-based physical',
        keywords: 'Sound · Participatory · Installation',
        href: 'noraebang.html',
        img: 'assets/noraebang_cover.jpg',
        desc: 'Korean karaoke booth built as community space, soundproofed and designed with mycelium and wood fiber using participatory design.'
      },
      {
        id: 'data-map',
        title: 'Data Resistances Map',
        year: '2026',
        tags: 'mapping data-viz critical-ai digital',
        keywords: 'Mapping · Data Viz · Critical AI/Data',
        href: 'data_resistances_map/',
        img: 'assets/data_resistance_map_cover.jpg',
        desc: 'Mapping data and AI supply chain resistance sites using GIS and Leaflet.js.'
      },
      {
        id: 'gazing',
        title: 'Gazing at the Cloud',
        year: '2026',
        tags: 'installation critical-ai both',
        keywords: 'Installation · Critical AI/Data',
        href: 'gazing-at-the-cloud.html',
        img: 'assets/gazing_at_the_cloud_cover.jpg',
        desc: 'Interactive installation studying the gaze and cloud infrastructures. Built with TouchDesigner, OAK-D camera, and ImageNet.'
      },
      {
        id: 'slop',
        title: 'SLOP OR NOT',
        year: '2026',
        tags: 'critical-ai digital',
        keywords: 'Critical AI/Data',
        href: 'slop-or-not.html',
        img: 'assets/slop_or_not_cover.jpg',
        desc: 'Satirical lottery tickets that make you guess whether a piece of art is AI-generated or not. Created for "Epistemologies of Slop" at tiat.'
      },
      {
        id: 'kaleidoscope',
        title: 'Espoo City Kaleidoscope',
        year: '2026–2027',
        tags: 'installation archive both',
        keywords: 'Installation · Archive',
        href: 'espoo-kaleidoscope.html',
        img: 'assets/espoo-kaleidoscope-cover.png',
        desc: 'Interactive kaleidoscope installation for Espoo City Museum using city archive footage. Interactivity programmed through TouchDesigner.'
      },
      {
        id: 'mycelium',
        title: 'Mycelium Design Workshops',
        year: '2026',
        tags: 'workshop bio-based participatory typography physical',
        keywords: 'Workshop · Participatory · Typography',
        href: 'mycelium-design-workshops.html',
        img: 'assets/mycelium_design_cover.jpg',
        desc: 'Tiles designed by participants using Korean typographic letters and mycelium material.'
      },
      {
        id: 'smd',
        title: 'Sonic Memory Decomposer',
        year: '2025',
        tags: 'sound ceramics physical',
        keywords: 'Sound · Ceramics',
        href: 'sonic_memory_decomposer.html',
        img: 'assets/smd_cover2.png',
        desc: 'Ceramics, sound, and physical computing — speaking into a ceramic cup disintegrates the memory sonically.'
      },
      {
        id: 'trust-box',
        title: 'Trust Box',
        year: '2025',
        tags: 'participatory archive physical',
        keywords: 'Participatory · Archive',
        href: 'trust_box/about.html',
        img: 'assets/trust_box_cover.jpg',
        desc: 'Participatory art, photography, and archive project.'
      },
      {
        id: 'dream-cafe',
        title: 'Dream Café',
        year: '2025',
        tags: 'sound participatory installation physical',
        keywords: 'Sound · Participatory · Installation',
        href: 'dream-cafe.html',
        img: 'assets/dream_cafe_cover.jpg',
        desc: 'A café in an abandoned mall that only takes a dream as payment.'
      },
      {
        id: 'wind',
        title: 'Wind Typography',
        year: '2024',
        tags: 'p5 data-viz typography digital',
        keywords: 'p5.js · Data Viz · Typography',
        href: 'wind_typography/about.html',
        img: 'assets/wind_typo_cover2.jpg',
        desc: 'p5.js project asking what a writing of wind would look like, using live wind data.'
      },
      {
        id: 'stretch',
        title: 'Stretch Marks',
        year: '2023',
        tags: 'p5 typography digital',
        keywords: 'p5.js · Typography',
        href: 'stretch-marks.html',
        img: 'assets/stretch_marks_cover.jpg',
        desc: 'p5.js project that allows letters to stretch and decay over time.'
      },
      {
        id: 'theremin',
        title: 'ASCII Theremin',
        year: '2023',
        tags: 'p5 sound typography digital',
        keywords: 'p5.js · Sound · Typography',
        href: 'ascii_theremin.html',
        img: 'assets/ascii_theremin_cover.png',
        desc: 'A digital theremin combined with ASCII art.'
      },
      {
        id: 'smash',
        title: 'Smash Computer',
        year: '2021',
        tags: 'js digital',
        keywords: 'JavaScript',
        href: 'https://smashcomputer.netlify.app',
        img: 'assets/smash_computer_cover.png',
        desc: 'My first creative coding project — smash a computer virtually. Made with vanilla JS.'
      },
      {
        id: 'map-cloud',
        title: 'Mapping the Cloud workshop',
        year: '2026',
        tags: 'workshop participatory mapping data-viz critical-ai physical',
        keywords: 'Workshop · Participatory · Mapping',
        href: 'mapping-the-cloud-workshop.html',
        img: 'assets/covers/mapping-the-cloud-cover.jpg',
        desc: 'Collective mapping workshop where participants add their connections to cloud infrastructure, creating a collective sculpture.'
      },
      {
        id: 'media-feed',
        title: 'Alt. Media Feed Design workshop',
        year: '2026',
        tags: 'workshop participatory digital',
        keywords: 'Workshop · Participatory',
        href: 'alt-media-feed-workshop.html',
        img: 'assets/covers/alternative-media-feeds-cover.jpg',
        desc: 'Participants design a speculative alternative media feed incorporating rest and care.'
      },
    ];

    const listEl   = document.getElementById('project-list');
    const detailEl = document.getElementById('project-detail');
    const countEl  = document.getElementById('count');
    const buttons  = document.querySelectorAll('.filter-btn');
    let activeId   = null;

    projects.forEach(p => {
      const el = document.createElement('div');
      el.className = 'project-item';
      el.dataset.id   = p.id;
      el.dataset.tags = p.tags;
      el.innerHTML = `
        <span class="item-title">${p.title}</span>
        <span class="item-year">${p.year}</span>
      `;
      el.addEventListener('click', () => showDetail(p.id));
      listEl.appendChild(el);
    });

    function showDetail(id) {
      const p = projects.find(x => x.id === id);
      if (!p) return;
      document.querySelectorAll('.project-item').forEach(el => el.classList.remove('active-item'));
      document.querySelector(`.project-item[data-id="${id}"]`).classList.add('active-item');
      activeId = id;

      const imgEl = p.img
        ? `<img class="detail-img" src="${p.img}" alt="${p.title}" onerror="this.outerHTML='<div class=\\'detail-img-placeholder\\'>no image yet</div>'">`
        : `<div class="detail-img-placeholder">no image yet</div>`;

      detailEl.innerHTML = `
        ${imgEl}
        <div class="detail-title">${p.title}</div>
        <div class="detail-meta">${p.year}</div>
        <div class="detail-keywords">${p.keywords}</div>
        <p class="detail-desc">${p.desc}</p>
        <a class="detail-link" href="${p.href}" ${p.href.startsWith('http') ? 'target="_blank"' : ''}>view project →</a>
      `;

      if (window.innerWidth <= 640) {
        detailEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        let visible = 0;

        document.querySelectorAll('.project-item').forEach(el => {
          const tags = el.dataset.tags.split(' ');
          const show = filter === 'all' || tags.includes(filter);
          el.classList.toggle('hidden', !show);
          if (show) visible++;
        });

        countEl.textContent = visible + (visible === 1 ? ' project' : ' projects');

        if (activeId) {
          const activeEl = document.querySelector(`.project-item[data-id="${activeId}"]`);
          if (activeEl && activeEl.classList.contains('hidden')) {
            detailEl.innerHTML = '<p class="detail-empty">← select a project</p>';
            activeId = null;
          }
        }
      });
    });
  </script>

</body>
</html>
