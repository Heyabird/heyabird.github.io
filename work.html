<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="cursors.css">
  <title>Work — Portfolio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #000;
      background: #fff;
      padding: 2rem;
      max-width: 960px;
      margin: 0 auto;
    }

    nav {
      display: flex;
      gap: 2rem;
      margin-bottom: 3rem;
      font-size: 14px;
    }

    nav a {
      color: #000;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    nav a:hover { border-bottom: 2px dotted #000; }
    nav a.active { border-bottom: 2px dotted #000; }

    /* ── filters ── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 1.5rem;
    }

    .filter-btn {
      font-size: 14px;
      padding: 3px 0;
      border: none;
      background: none;
      color: #000;
      cursor: pointer;
      font-family: Arial, sans-serif;
      position: relative;
    }

    .filter-btn::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: #000;
      transform: scaleX(0);
      transition: transform 0.15s ease;
    }

    .filter-btn.active::after { transform: scaleX(1); }
    .filter-btn:hover { opacity: 0.5; }

    /* ── list ── */
    .project-list {}

    .project-item {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 2.3rem;
      padding: 1.25rem 0;
      text-decoration: none;
      color: #000;
    }

    .project-item.hidden { display: none; }

    .project-thumb {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border: 1px solid #eee;
      display: block;
      background: #f5f5f5;
    }

    .project-thumb-placeholder {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #f0f0f0;
      border: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #ccc;
    }

    .project-info {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding-top: 0.1rem;
    }

    .project-meta {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
    }

    .type-label {
      font-size: 12px;
      font-family: Arial, sans-serif;
      white-space: nowrap;
    }

    .project-year {
      font-size: 12px;
      color: #bbb;
    }

    .project-title {
      font-size: 16px;
      font-weight: normal;
      line-height: 1.3;
    }


    .project-desc {
      font-size: 15px;
      color: #666;
      line-height: 1.6;
      margin-top: 0.2rem;
    }

    .project-links {
      display: flex;
      gap: 1rem;
      margin-top: 0.4rem;
    }

    .project-link {
      font-size: 12px;
      color: #000;
      text-decoration: none;
      border-bottom: 1px dotted #000;
    }

    .project-link:hover { opacity: 0.6; }

    /* ── mobile ── */
    @media (max-width: 600px) {
      .project-item {
        grid-template-columns: 100px 1fr;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="work.html"class="active">Work</a>
    <a href="notebook.html">Notebook</a>
    <a href="about.html">About</a>
  </nav>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="Art">[Art]</button>
    <button class="filter-btn" data-filter="Installation">[Installation]</button>
    <button class="filter-btn" data-filter="Website">[Website]</button>
    <button class="filter-btn" data-filter="Workshop">[Workshop]</button>
    <button class="filter-btn" data-filter="Community Space">[Community Space]</button>
    <button class="filter-btn" data-filter="Print">[Print]</button>
    <button class="filter-btn" data-filter="Research">[Research]</button>
  </div>

  <div class="project-list" id="project-list"></div>

  <script>
    const typeColors = {
      'Art':             '#000',
      'Installation':    '#0050c8',
      'Website':         '#007a30',
      'Workshop':        '#b06000',
      'Community Space': '#990000',
      'Print':           '#006868',
      'Research':        '#5500bb'
    };

    const projects = [
      {
        id: 'map-cloud',
        title: 'Warm Clouds over the Cool Planet',
        type: 'Workshop',
        year: '2026',
        tags: 'workshop participatory mapping data-viz critical-ai research',
        keywords: 'Workshop · Participatory · Mapping',
        href: 'warm-clouds.html',
        img: 'assets/covers/mapping-the-cloud-cover.jpg',
        desc: 'Collective mapping workshop where participants map their connections to cloud infrastructure, creating a collective sculpture.'
      },
      {
        id: 'noraebang',
        title: 'Noraebang',
        type: 'Community Space',
        year: '2026',
        tags: 'sound participatory installation bio-based',
        keywords: 'Sound · Participatory · Installation',
        href: 'noraebang.html',
        site: 'https://noraebang-fi.github.io/',
        img: 'assets/covers/noraebang-cover.jpg',
        desc: 'Karaoke booth built as community space, soundproofed and designed with mycelium and wood fiber using participatory design. Funded by Sustainability Action Booster.'
      },
      {
        id: 'data-map',
        title: 'Data Resistances Map',
        type: 'Website',
        year: '2026',
        tags: 'mapping data-viz critical-ai digital',
        keywords: 'Mapping · Data Viz · Critical AI/Data',
        site: 'data_resistances_map/',
        img: 'assets/covers/data-resistances-map-cover.jpg',
        desc: 'Mapping data and AI supply chain resistance sites using GIS and Leaflet.js.'
      },
      {
        id: 'gazing',
        title: 'Gazing at the Cloud',
        type: 'Installation',
        year: '2026',
        tags: 'installation critical-ai',
        keywords: 'Installation · Critical AI/Data',
        href: 'gazing-at-the-cloud.html',
        img: 'assets/gazing_at_the_cloud_cover.jpg',
        desc: 'Interactive installation studying the gaze and cloud infrastructures. Built with TouchDesigner, OAK-D camera, and ImageNet.'
      },
      {
        id: 'mycelium',
        title: 'Mycelium Design Workshops',
        type: 'Workshop',
        year: '2026',
        tags: 'workshop bio-based participatory typography',
        keywords: 'Workshop · Participatory · Typography',
        href: 'mycelium-design-workshops.html',
        img: 'assets/mycelium_design_cover.jpg',
        desc: 'Tiles designed by participants using Korean typographic letters and mycelium material.'
      },
      {
        id: 'oldwritings',
        title: 'Some Old Writings',
        type: 'Website',
        year: '2025',
        tags: 'data-viz d3',
        keywords: 'Data Viz · Typography',
        site: 'some_old_writings/index.html',
        img: 'assets/covers/some-old-writings-cover.jpg',
        desc: 'Visualizing some of the oldest known writings in the world using d3.js.'
      },
      {
        id: 'smd',
        title: 'Sonic Memory Decomposer',
        type: 'Art',
        year: '2025',
        tags: 'sound ceramics',
        keywords: 'Sound · Ceramics',
        href: 'sonic_memory_decomposer.html',
        img: 'assets/smd_cover2.png',
        desc: 'Ceramics, sound, and physical computing. Speaking into a ceramic cup disintegrates a memory sonically.'
      },
      {
        id: 'trust-box',
        title: 'Trust Box',
        type: 'Art',
        year: '2025',
        tags: 'participatory archive',
        keywords: 'Participatory · Archive',
        href: 'trust_box/about.html',
        site: 'trust_box.html',
        img: 'assets/trust_box_cover.jpg',
        desc: 'Participatory art, photography, and archive project.'
      },
      {
        id: 'dream-cafe',
        title: 'Dream Café',
        type: 'Art',
        year: '2025',
        tags: 'sound participatory installation',
        keywords: 'Sound · Participatory · Installation',
        href: 'dream-cafe.html',
        img: 'assets/dream_cafe_cover.jpg',
        desc: 'A café in an abandoned mall that only takes a dream as payment.'
      },
      {
        id: 'wind',
        title: 'Wind Typography',
        type: 'Website',
        year: '2024',
        tags: 'p5 data-viz typography digital',
        keywords: 'p5.js · Data Viz · Typography',
        href: 'wind_typography/about.html',
        site: '/wind_typography/index.html',
        img: 'assets/wind_typo_cover2.jpg',
        desc: 'p5.js project asking what a writing of wind would look like, using live wind data.'
      },
      {
        id: 'stretch',
        title: 'Stretch Marks',
        type: 'Print',
        year: '2023',
        tags: 'p5 typography digital',
        keywords: 'p5.js · Typography',
        href: 'stretch-marks.html',
        img: 'assets/stretch_marks_cover.jpg',
        desc: 'Letters stretched as the longer it is typed, created via p5.js.'
      },
      {
        id: 'workinaction',
        title: 'Work in Action: A Graphic Novel (BA Thesis)',
        type: 'Research',
        year: '2017',
        tags: 'research',
        keywords: 'Research',
        href: 'https://digitalcollections.wesleyan.edu/Documents/Detail/a-work-in-action-a-graphic-novel/451160',
        img: 'assets/work_in_action_example_page2.png',
        desc: 'An honors thesis at Wesleyan University that follows the personal stories of factory workers in China to explore the life inside seemingly oppressive labor structures. Research was funded by Davenport Research Grant.'
      },
      {
        id: 'kaleidoscope',
        title: 'Espoo City Kaleidoscope',
        type: 'Installation',
        year: '2026–2027 (WIP)',
        tags: 'installation archive both',
        keywords: 'Installation · Archive',
        href: 'espoo-kaleidoscope.html',
        img: 'assets/espoo_city_kaleidoscope1.png',
        desc: 'WIP Interactive kaleidoscope installation for Espoo City Museum using city archive footage. Interactivity programmed through TouchDesigner.'
      },
      {
        id: 'feedcloud',
        title: 'Feed, Cloud, and Bodies',
        type: 'Research',
        year: '2026 (WIP)',
        tags: 'research',
        keywords: 'Research',
        href: '',
        img: 'assets/covers/feed-cloud-bodies-cover.png',
        desc: 'Feed, Cloud, and Bodies: Exhaustion and Resistance in Algorithmic Media is an ongoing MA thesis at Aalto University. It studies the relationship between two entangled exhaustions: the depletion of human attention by algorithmic feeds, and the depletion of water, minerals, and human labor by the data centers that power them.'
      },
      {
        id: 'media-feed',
        title: 'Alternative Media Feed Design',
        type: 'Workshop',
        year: '2026 (WIP)',
        tags: 'workshop participatory digital',
        keywords: 'Workshop · Participatory',
        href: '',
        img: 'assets/covers/alternative-media-feeds-cover.jpg',
        desc: 'Participants design a speculative alternative media feed incorporating rest and care.'
      }
    ];

    const listEl  = document.getElementById('project-list');
    const buttons = document.querySelectorAll('.filter-btn');

    projects.forEach(p => {
      const color = typeColors[p.type] || '#555';

      const el = document.createElement('div');
      el.className = 'project-item';
      el.dataset.tags = p.tags;
      el.dataset.type = p.type;

      // thumb
      const thumbWrap = document.createElement('div');
      if (p.img) {
        const img = document.createElement('img');
        img.className = 'project-thumb';
        img.src = p.img;
        img.alt = p.title;
        img.onerror = () => {
          img.outerHTML = `<div class="project-thumb-placeholder">no image</div>`;
        };
        thumbWrap.appendChild(img);
      } else {
        thumbWrap.innerHTML = `<div class="project-thumb-placeholder">no image</div>`;
      }

      // info
      const info = document.createElement('div');
      info.className = 'project-info';

      const meta = document.createElement('div');
      meta.className = 'project-meta';
      meta.innerHTML = `<span class="type-label">[${p.type}]</span><span class="project-year">${p.year}</span>`;

      const titleEl = document.createElement('div');
      titleEl.className = 'project-title';
      titleEl.textContent = p.title;

      const descEl = document.createElement('div');
      descEl.className = 'project-desc';
      descEl.innerHTML = p.desc;

      const links = document.createElement('div');
      links.className = 'project-links';
      if (p.href) {
        const a = document.createElement('a');
        a.className = 'project-link';
        a.href = p.href;
        a.textContent = 'project details →';
        if (p.href.startsWith('http')) a.target = '_blank';
        links.appendChild(a);
      }
      if (p.site) {
        const a = document.createElement('a');
        a.className = 'project-link';
        a.href = p.site;
        a.target = '_blank';
        a.textContent = 'visit website →';
        links.appendChild(a);
      }

      info.appendChild(meta);
      info.appendChild(titleEl);
      info.appendChild(descEl);
      if (links.children.length) info.appendChild(links);

      el.appendChild(thumbWrap);
      el.appendChild(info);
      listEl.appendChild(el);
    });

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        document.querySelectorAll('.project-item').forEach(el => {
          el.classList.toggle('hidden', filter !== 'all' && el.dataset.type !== filter);
        });
      });
    });

    const params = new URLSearchParams(window.location.search);
    const preFilter = params.get('filter');
    if (preFilter) {
      const btn = document.querySelector(`.filter-btn[data-filter="${preFilter}"]`);
      if (btn) btn.click();
    }
  </script>

</body>
</html>
