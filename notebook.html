<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing — Portfolio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #000;
      background: #fff;
      padding: 2rem;
      max-width: 960px;
      margin: 0 auto;
    }

    nav {
      display: flex;
      gap: 2rem;
      margin-bottom: 3rem;
      font-size: 14px;
    }

    nav a {
      color: #000;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    nav a:hover { border-bottom: 2px dotted #000; }
    nav a.active { border-bottom: 2px dotted #000; }

    .writing-list {
      border-top: 1px dotted #ccc;
    }

    .writing-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: baseline;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px dotted #ccc;
      text-decoration: none;
      color: #000;
    }

    .writing-item:hover .writing-title {
      border-bottom: 2px dotted #000;
    }

    .writing-title {
      font-size: 15px;
      border-bottom: 2px dotted transparent;
      display: inline-block;
      width: fit-content;
    }

    .writing-meta {
      font-size: 13px;
      color: #999;
      white-space: nowrap;
      text-align: right;
    }

    .writing-item-inner {
      display: flex;
      flex-direction: column;
    }

    .type-label {
      font-size: 13px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    @media (max-width: 600px) {
      .writing-item {
        grid-template-columns: auto 1fr;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .writing-meta { display: none; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="work.html">Work</a>
    <a href="notebook.html" class="active">notebook</a>
    <a href="about.html">About</a>
  </nav>

  <div class="writing-list">

    <a class="writing-item" href="gosari.html">
      <span class="type-label" style="color: #007a30;">[writing]</span>
      <div class="writing-item-inner">
        <span class="writing-title">Gosari</span>
      </div>
      <span class="writing-meta">2025</span>
    </a>

    <!-- <a class="writing-item" href="writing-essay-template-2.html">
      <span class="type-label" style="color: #5500bb;">[drawing]</span>
      <div class="writing-item-inner">
        <span class="writing-title">Essay Title Two</span>
      </div>
      <span class="writing-meta">2025</span>
    </a> -->

  </div>

</body>
</html>
