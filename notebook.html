<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Geist+Pixel&family=VT323&display=swap" rel="stylesheet">
  <title>Writing — Portfolio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #000;
      background: #fff;
      padding: 2rem;
      max-width: 960px;
      margin: 0 auto;
    }

    nav {
      display: flex;
      gap: 2rem;
      margin-bottom: 3rem;
      font-size: 14px;
    }

    nav a {
      color: #000;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    nav a:hover { border-bottom: 2px dotted #000; }
    nav a.active { border-bottom: 2px dotted #000; }

    h3 {
      font-family: 'DotGothic16';
    }

    .writing-list {
      border-top: 1px solid #000;
    }

    .writing-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: baseline;
      gap: 2rem;
      padding: 1rem 0;
      border-bottom: 1px solid #ebebeb;
      text-decoration: none;
      color: #000;
    }

    .writing-item:hover .writing-title {
      border-bottom: 1px solid #000;
    }

    .writing-title {
      font-size: 15px;
      border-bottom: 1px solid transparent;
      display: inline;
    }

    .writing-meta {
      font-size: 13px;
      color: #999;
      white-space: nowrap;
      text-align: right;
    }

    .writing-desc {
      font-size: 13px;
      color: #666;
      margin-top: 3px;
      grid-column: 1 / 2;
    }

    .writing-item-inner {
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 600px) {
      .writing-item {
        grid-template-columns: 1fr;
        gap: 0.25rem;
      }
      .writing-meta { text-align: left; }
    }
  </style>
</head>
<body>
